# Defaults for the popgen_rbceq2 workflow. A run's own config is merged over this one, so
# anything set here can be overridden per run — see config_template.toml for the keys a run has
# to supply.
#
# Every [workflow.<section>] table below is a stage's compute/tuning section, named after its
# class (see stage_support.config_section). test_stage_support fails if a section here is not
# read by a stage, so a renamed class cannot leave its tuning stranded.

[workflow]
name = 'popgen_rbceq2'
# Our release version: the trailing half of the rbceq2_<tool version>_<release> path segment
# above the stage directories, so one release is one tree. Bump only when a pipeline change
# alters the outputs — the tool-version half already separates rbceq2 bumps.
#
# v2: the defining-sites extract gained a trailing INFO/POSTHOC column and the QC flags gained
# the POSTHOC prefix and the src= metric. Both change every run, exome or genome, and an
# extract written by v1 does not parse under v2 — a fresh tree is what keeps the two apart.
#
# v3: three exome-only output changes. The merge now fills only defining sites outside the
# cohort's capture design, so a hole inside it stays NOCOV; it drops a post-hoc variant whose
# span reaches a base DRAGEN called, so that hole stays NOCOV too; and a site's QC flag name
# carries its provenance joined to its severity, so a sub-threshold recovered site reads
# LOWQ+POSTHOC rather than LOWQ. None moves an output path, so without a fresh tree an exome
# re-run would reuse its v2 files and none would take effect. Genome outputs are byte-identical
# to v2; they move tree only because the release version is workflow-wide.
version = 'v3'
status_reporter = 'metamist'
# driver_image =
# sequencing_type = 'genome'
# input_cohorts = []

[references]
# Build the gVCFs were called against. Selects the committed resources/bg_*.<genome>.* and is
# passed to `rbceq2 --reference_genome`; a build with no committed resources fails at graph
# construction. Only GRCh38 is generated today.
genome_build = 'GRCh38'

[workflow.posthoc_genotype_off_target_sites]
# Exome sequencing groups only. Streams the CRAM from GCS over GATK's NIO support and calls
# only the ~136kb of padded defining-site intervals, so almost nothing is read: the storage
# below is for the localised reference (about 3Gb of fasta, .fai and .dict) and the few-Mb
# output gVCF, not for the CRAM.
cpu = 2
memory = "standard"
storage = "20Gi"

[workflow.select_off_design_defining_sites]
# Exome sequencing groups only, and one job for the whole run rather than one per sequencing
# group: it subtracts the capture design's intervals from the committed defining sites, and
# that answer depends on nothing about any individual sample.
#
# An exome run must set `exome_design_bed` here: the [references] key of the capture design BED
# its gVCFs were called against, e.g.
# 'exome_probesets_hg38/twist_vcgs_custom_exome_covered_targets_bed'. Post-hoc calls fill only
# the defining sites that design never targeted; a hole inside it reaches the QC as NOCOV.
#
# Deliberately not defaulted. Every default is the wrong design for some cohort, and being
# wrong here is silent: it does not fail, it just fills the wrong set of sites. A run that
# does not name a design fails while the graph is built. Genome runs never read the key.
#
# One core is enough: bedtools intersect over a vendor design's ~230k intervals is about 0.1s,
# and the storage is for the design BED itself, a few Mb.
cpu = 1
memory = "lowmem"
storage = "10Gi"

[workflow.filter_and_convert_gvcfs_for_rbceq2]
# Sized higher than the other stages: this is the only one that localises the raw gVCF
# (12-15Gb), and it needs disk for that plus the filtered output.
cpu = 4
memory = "highmem"
storage = "40Gi"

[workflow.genotype_blood_groups_with_rbceq2]
cpu = 2
memory = "standard"
storage = "10Gi"

[workflow.flag_blood_group_call_qc]
cpu = 1
memory = "standard"
storage = "10Gi"
# Flag a defining site whose FORMAT/DP is below this (or missing). A site inside a reference
# block is assessed on the block's DP, which is the median depth across the band and so the
# best available estimate for a site whose position in the block is unknowable. The block's
# MIN_DP is a span floor that one shallow base can set, so it is reported in the flag
# alongside the span rather than filtered on.
min_depth = 10
# Flag a defining site whose FORMAT/GQ is below this (or missing).
#
# Keep this on a GQ band edge. Our gVCFs are banded at 10/20/30/40 (each file declares the
# bands: `##GVCFBlock=minGQ=20(inclusive),maxGQ=30(exclusive)` and so on). GQ is what blocks
# are banded on, so a block's single GQ bounds every base in it exactly and no sub-threshold
# base can hide inside a block that passes, but only for a threshold that is itself an edge.
# 20 qualifies, as would 10, 30 or 40; a value like 25 does not, and would flag sites whose
# real GQ is 26-29 from a block reporting 20.
#
# Deliberately quiet, and gnomAD-aligned: raising these towards a hard filter's values
# (DP 20 / GQ 30) would flag most of a typical sample's systems and make the annotation
# useless. See the README for what the thresholds were chosen against.
min_gq = 20

[workflow.combine_rbceq2_outputs_per_cohort]
cpu = 2
memory = "standard"
storage = "10Gi"
