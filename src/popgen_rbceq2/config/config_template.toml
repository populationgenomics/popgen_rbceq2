# What a run has to supply, on top of popgen_rbceq2_default_config.toml. Copy this, fill it in,
# and pass both to analysis-runner:
#
#   analysis-runner --dataset <dataset> --access-level test --output-dir '' \
#     --config src/popgen_rbceq2/config/popgen_rbceq2_default_config.toml \
#     --config my-cohort.toml \
#     --description "rbceq2 blood-group genotyping for <cohort>" \
#     --image australia-southeast1-docker.pkg.dev/cpg-common/images/popgen_rbceq2:<tag> \
#     popgen_rbceq2
#
# Configs merge left to right, so this one wins over the defaults.

[workflow]
# Metamist cohort IDs to genotype. Every sequencing group in them with a gVCF is included;
# those without one are skipped, not failed.
input_cohorts = ['COH123']
sequencing_type = 'genome'

# Uncomment to run part of the branch only. Stage names are the class names.
# only_stages = ['FilterAndConvertGvcfsForRbceq2', 'GenotypeBloodGroupsWithRbceq2']

# Uncomment to rebuild a stage whose outputs already exist.
# force_stages = ['FlagBloodGroupCallQc']

# Required for an exome run, ignored for a genome one. The [references] key of the capture
# design BED the gVCFs were called against. Post-hoc calls fill only the defining sites that
# design never targeted, so this has to be the design DRAGEN used, not merely a design the
# samples resemble: the job fails if DRAGEN has records at sites outside it.
#
# Where a vendor ships both, take the *Covered* (probe footprint) entry, not Regions. The two
# differ, and on the validation cohorts Regions would have recovered 691 sites instead of 1,650.
#
# The README section "An exome run must name its capture design" lists the values for the
# designs seen so far, so you should not need the references repo. The two used to date:
#
#   Twist Comprehensive Exome + VCGS custom content
#     'exome_probesets_hg38/twist_vcgs_custom_exome_covered_targets_bed'
#   Agilent SureSelect Clinical Research Exome v2
#     'exome_probesets_hg38/agilent_sureselect_clinical_research_exome_v2_covered_by_probes_bed'
#
# [workflow.select_off_design_defining_sites]
# exome_design_bed = 'exome_probesets_hg38/twist_vcgs_custom_exome_covered_targets_bed'

[references]
# Only set this if the gVCFs were called against something other than the default GRCh38, and
# resources/bg_*.<build>.* have been generated for it.
# genome_build = 'GRCh38'
