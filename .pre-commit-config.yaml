default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # The committed blood-group resources are generated; a hook that rewrites them would
        # make them differ from what gen_bg_resources.py produces.
        exclude: '\.bed$|\.tsv$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
      - id: ruff-format

  # Catches a CPG internal ID (sample, participant, sequencing group) committed to the repo.
  - repo: https://github.com/populationgenomics/pre-commits
    rev: "v0.1.3"
    hooks:
      - id: cpg-id-checker

  # Type checking runs in CI (pyright). Skipped from pre-commit because
  # pyright is slower than is comfortable for a per-commit hook.
