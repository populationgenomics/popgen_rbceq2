# Project metadata plus the CPG-standard ruff + pyright config. Fill in the
# REPLACE-ME name and adjust deps for your repo. Run from source (no build
# backend); add one when you ship a distributable package.

[project]
name = "PopGen-RBCeq2"
version = "0.0.1"
requires-python = "==3.12.*"

[dependency-groups]
# Managed by uv: `uv sync` installs these for development.
dev = ["ruff", "pyright", "pytest", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "W",
    "ANN", "ARG", "BLE", "COM", "DTZ", "ERA", "EXE", "ICN", "ISC",
    "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF",
    "SIM", "SLF", "T10", "TID", "UP", "YTT",
]

fixable = ["ALL"]

ignore = [
    "COM812",  # Trailing comma prohibited (conflicts with the formatter)
    # D1xx — docstring *presence*. Format (D2/D3/D4) is enforced when a
    # docstring exists, but one isn't required on every public symbol.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "Q000",    # Single quotes found but double quotes preferred
    "Q003",    # Change outer quotes (conflicts with the single-quote formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # asserts are the standard pytest idiom
    "SLF001", # tests legitimately reach into module privates
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Complexity thresholds: roughly double the ruff defaults, so the checks fire on
# genuinely sprawling code but not on everyday parsers and dispatchers.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 10
max-statements = 80
max-locals = 25

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
