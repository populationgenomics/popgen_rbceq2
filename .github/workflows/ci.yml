name: CI

# Fast checks on every pull request: no cloud credentials, no image build. The suite also runs
# inside the built driver image (test.yaml), which is what proves the image can run it — this
# job is the one that gives a PR an answer in a minute.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned to the same version as .pre-commit-config.yaml. Unpinned, a ruff release
      # turns every open PR red without anyone changing code, which is how the 0.16
      # markdown formatting change broke main.
      - name: Ruff lint
        run: uvx ruff@0.16.3 check .
      - name: Ruff format check
        run: uvx ruff@0.16.3 format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --group dev
      - name: Pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --group dev
      - name: Tests
        run: uv run pytest
